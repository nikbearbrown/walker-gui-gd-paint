<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="32" y="44" font-size="26" font-weight="700">Recovered stroke + undo state flow · GD Paint</text>
<text x="32" y="70" font-size="14" fill="#5b6b7c">paint_control.gd polls the left mouse button every frame. Undo has exactly one level. Save is in code but never exercised.</text>
