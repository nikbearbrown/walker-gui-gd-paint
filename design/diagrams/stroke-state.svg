<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" role="img" aria-labelledby="t d">
<title id="t">Recovered stroke + undo state flow · GD Paint</title>
<desc id="d">Idle canvas; press inside canvas starts a stroke; pencil/eraser add dabs while held, shapes add one record on release; undo removes the last stroke once; clear empties; save exports. IDs: M-01..M-10, S-02, F-01..F-06.</desc>
